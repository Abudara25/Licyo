name: check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Dépendances épinglées du lockfile (markdown-it 14.1.0, phase 4E.1), jamais une résolution libre.
      - run: npm ci
      - run: npm run check
