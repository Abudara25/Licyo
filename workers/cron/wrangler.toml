name = "licyo-cron"
main = "index.js"
compatibility_date = "2026-09-01"

# Tous les jours à 7h UTC (9h en été, 8h en hiver à Paris).
[triggers]
crons = ["0 7 * * *"]

[vars]
SITE_URL = "https://clubdemo.licyo.fr"

# CRON_SECRET n'est jamais écrit ici : `npx wrangler secret put CRON_SECRET` depuis ce dossier.
